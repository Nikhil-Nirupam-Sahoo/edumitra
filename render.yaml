# ---------------------------------------------------------------------------
# EduMitra on Render — free-tier web app blueprint.
#
#   Render dashboard → New + → Blueprint → point at this repo → Apply.
#
# Provisions:
#   * edumitra      — one free web service (Docker) running the Fastify API
#                     AND serving the built PWA at the same origin
#                     (https://edumitra.onrender.com).
#   * edumitra-db   — free managed PostgreSQL (NOTE: expires 30 days after
#                     creation — see README for the permanent Neon option).
#
# Render automatically translates every env var below into a Docker build arg
# of the same name, which is how SYNC_SIGNING_SECRET reaches the client bundle
# at build time so PWA signatures match the server at runtime.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: edumitra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's standard web-service port.
      - key: PORT
        value: '10000'
      - key: DB_DRIVER
        value: postgres
      # Generated once at blueprint apply; injected at runtime AND bake-time.
      - key: SYNC_SIGNING_SECRET
        generateValue: true
      # TRANSLATION — free with NO key and NO billing.
      # Unset, translation runs through MyMemory and the UI *and* the lesson
      # content translate out of the box. Setting this switches to Google for
      # better quality, but Google requires a billing account, so it stays
      # optional. Never put it in client code: the browser calls
      # /api/v1/translate and /api/v1/translate/content and this server proxies.
      - key: GOOGLE_TRANSLATION_API_KEY
        sync: false
      # READ-ALOUD — optional, and the only free source with an Odia voice.
      # Free key, no card: https://bhashini.gov.in/ulca (Government of India).
      # Unset, read-aloud falls back to the device's own speech voices.
      - key: BHASHINI_API_KEY
        sync: false
      # Sign in with Google. A client ID, not a secret — public by design, and
      # verified server-side on every sign-in. Free, no billing. Unset hides the
      # Google button. Create it as an OAuth client ID of type "Web application"
      # with this service URL as an authorised JavaScript origin.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Self-registration is open by default; teacher accounts need this set to
      # "true" because a teacher decides what a class can see.
      - key: ALLOW_TEACHER_SIGNUP
        value: 'false'
      # AI tutor (Help tab). Same rule as the translation key: paste it here,
      # never into client code. The browser calls /api/v1/support/ask and this
      # server proxies to Anthropic. Unset → the Help tab says the tutor is not
      # switched on and points the student at a mentor instead.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: edumitra-db
          property: connectionString

databases:
  - name: edumitra-db
    plan: free
    databaseName: edumitra
    user: edumitra
