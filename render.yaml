# ---------------------------------------------------------------------------
# EduMitra on Render — free-tier web app blueprint.
#
#   Render dashboard → New + → Blueprint → point at this repo → Apply.
#
# Provisions:
#   * edumitra      — one free web service (Docker) running the Fastify API
#                     AND serving the built PWA at the same origin
#                     (https://edumitra.onrender.com).
#   * edumitra-db   — free managed PostgreSQL (NOTE: expires 30 days after
#                     creation — see README for the permanent Neon option).
#
# Render automatically translates every env var below into a Docker build arg
# of the same name, which is how SYNC_SIGNING_SECRET reaches the client bundle
# at build time so PWA signatures match the server at runtime.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: edumitra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's standard web-service port.
      - key: PORT
        value: '10000'
      - key: DB_DRIVER
        value: postgres
      # Generated once at blueprint apply; injected at runtime AND bake-time.
      - key: SYNC_SIGNING_SECRET
        generateValue: true
      # ONE key, THREE features. Enable all of these for the key in Google
      # Cloud → APIs & Services → Library:
      #   * Cloud Translation API   -> translating the UI
      #   * Cloud Text-to-Speech API -> read-aloud, incl. Odia (or-IN)
      #   (content translation rides on Cloud Translation)
      #
      # SECURITY: paste the key here only, and restrict it in Google Cloud to
      # this service's egress IPs. It is read by the server and never sent to
      # the browser — the client calls /api/v1/translate, /api/v1/translate/content
      # and /api/v1/tts, and this server proxies all three.
      #
      # Leave it unset and the app still works: bundled locales (en/hi/ta/or)
      # and the device's own speech voices take over.
      - key: GOOGLE_TRANSLATION_API_KEY
        sync: false
      # AI tutor (Help tab). Same rule as the translation key: paste it here,
      # never into client code. The browser calls /api/v1/support/ask and this
      # server proxies to Anthropic. Unset → the Help tab says the tutor is not
      # switched on and points the student at a mentor instead.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: edumitra-db
          property: connectionString

databases:
  - name: edumitra-db
    plan: free
    databaseName: edumitra
    user: edumitra
